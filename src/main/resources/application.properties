spring.application.name=customs-flow-backend

# Server Configuration
server.port=8080

# Database Configuration (Neon PostgreSQL Cloud DB)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://neondb_owner:npg_E0TRe08BkDFJ@ep-falling-fog-a6ofzm91.us-west-2.aws.neon.tech/neondb?sslmode=require}
