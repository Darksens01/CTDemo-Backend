spring.application.name=customs-flow-backend

# Server Configuration
server.port=${PORT:8080}

# Database Configuration (Neon PostgreSQL Cloud DB)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:ep-falling-fog-a6ofzm91.us-west-2.aws.neon.tech}:${DB_PORT:5432}/${DB_NAME:neondb}?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:neondb_owner}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:npg_JlN1CTEA7xqp}}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

# HikariCP Pool Settings (Handles Neon Serverless Cold Starts)
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=5

# H2 Console Settings
spring.h2.console.enabled=false

# JPA / Hibernate Properties
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics

# JWT Configuration
app.jwt.secret=CustomsFlowSuperSecretKeyForJWTAuth2026WithJava25LTSVersion
app.jwt.expiration-ms=86400000

# Swagger OpenAPI Path
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
