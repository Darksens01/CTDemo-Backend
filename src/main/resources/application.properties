spring.application.name=customs-flow-backend

# Server Configuration
server.port=8080

# Database Configuration (H2 file-based persistence, PostgreSQL ready)
spring.datasource.url=jdbc:h2:file:./data/customsdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console Settings
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Properties
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics

# JWT Configuration
app.jwt.secret=CustomsFlowSuperSecretKeyForJWTAuth2026WithJava25LTSVersion
app.jwt.expiration-ms=86400000

# Swagger OpenAPI Path
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
