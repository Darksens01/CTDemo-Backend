spring.application.name=customs-flow-backend

# Server Configuration
server.port=${PORT:8080}

# Database Configuration (Neon PostgreSQL Cloud DB)
spring.datasource.url=jdbc:postgresql://${DB_HOST:ep-falling-fog-a6ofzm91-pooler.us-west-2.aws.neon.tech}:${DB_PORT:5432}/${DB_NAME:neondb}?sslmode=${DB_SSLMODE:require}&channel_binding=require
spring.datasource.username=${DB_USER:neondb_owner}
spring.datasource.password=${DB_PASSWORD:npg_E0TRe08BkDFJ}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Pool Settings (Handles Neon Serverless Cold Starts)
spring.datasource.hikari.connection-timeout=60000
