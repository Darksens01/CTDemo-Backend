spring.application.name=bracket-ops-backend

server.port=${PORT:8080}

# H2 In-Memory Database Configuration
spring.datasource.url=jdbc:h2:mem:bracketops;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console Settings
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Properties for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics

# JWT Configuration
app.jwt.secret=CustomsFlowSuperSecretKeyForJWTAuth2026WithJava25LTSVersion
app.jwt.expiration-ms=86400000

# Swagger OpenAPI Path
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
